name: Release Android APK

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump patch version before build"
        type: boolean
        default: true
  push:
    tags:
      - "android-v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install

      - name: Build Android APK
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.bump }}" = "true" ]; then
            pnpm --filter @ai-hub/android-app release -- --no-publish
          else
            pnpm --filter @ai-hub/android-app build -- --no-publish
          fi

      - name: Read version
        id: version
        run: echo "value=$(node -p "require('./packages/android-app/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-hub-android-${{ steps.version.outputs.value }}
          path: packages/android-app/dist/ai-hub-*.apk

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/android-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          TAG="android-v${VERSION}"
          APK="packages/android-app/dist/ai-hub-${VERSION}.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --title "Android ${VERSION}" \
              --notes "AI Hub Android WebView build ${VERSION}"
          fi
